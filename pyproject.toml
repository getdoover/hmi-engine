[project]
name = "hmi-engine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydoover>=1.0.0a8",
]

[project.scripts]
doover-app-run = "hmi_engine:main"
hmi-browser = "hmi_engine.browser:main"
export-config = "hmi_engine.app_config:export"
export-ui = "hmi_engine.app_ui:export"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "aiohttp>=3.11.18",
    "grpcio>=1.71.0",
    "protobuf>=6.30.2",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
    "requests>=2.32.3",
]
